<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PassForge — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script>
    // Redirect away if already logged in
    if (localStorage.getItem('pf_session')) location.href = 'intro.html';
  </script>
</head>
<body class="auth-page">

<div class="auth-card">

  <!-- Logo -->
  <div class="auth-logo">
    <div class="logo">Pass<span>Forge</span></div>
    <p class="tagline">Password Utility Terminal</p>
  </div>

  <!-- Tabs -->
  <div class="auth-tabs">
    <button class="auth-tab active" data-tab="login"  onclick="showForm('login')">Log In</button>
    <button class="auth-tab"        data-tab="signup" onclick="showForm('signup')">Sign Up</button>
  </div>

  <!-- ── LOGIN FORM ── -->
  <div id="loginForm" class="auth-form">
    <div class="auth-field">
      <label class="auth-label" for="liEmail">Email</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="text" id="liEmail" placeholder="you@example.com"
               onkeydown="if(event.key==='Enter')handleLogin()"/>
      </div>
      <span class="field-error" id="liEmailErr"></span>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="liPass">Password</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="password" id="liPass" placeholder="••••••••"
               style="padding-right:2.4rem" onkeydown="if(event.key==='Enter')handleLogin()"/>
        <button class="auth-eye" onclick="toggleAuthPass('liPass',this)">👁</button>
      </div>
      <span class="field-error" id="liPassErr"></span>
    </div>

    <button class="btn-auth" onclick="handleLogin()">Log In →</button>

    <div class="auth-divider">or</div>
    <button class="btn-guest" onclick="continueAsGuest()">Continue as Guest</button>
  </div>

  <!-- ── SIGN UP FORM ── -->
  <div id="signupForm" class="auth-form hidden">
    <div class="auth-field">
      <label class="auth-label" for="suName">Full Name</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="text" id="suName" placeholder="Piyush Shahi"/>
      </div>
      <span class="field-error" id="suNameErr"></span>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="suEmail">Email</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="text" id="suEmail" placeholder="you@example.com"/>
      </div>
      <span class="field-error" id="suEmailErr"></span>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="suPass">Password</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="password" id="suPass" placeholder="Min. 8 characters"
               style="padding-right:2.4rem"/>
        <button class="auth-eye" onclick="toggleAuthPass('suPass',this)">👁</button>
      </div>
      <span class="field-error" id="suPassErr"></span>
    </div>

    <div class="auth-field">
      <label class="auth-label" for="suConf">Confirm Password</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="password" id="suConf" placeholder="Repeat password"
               style="padding-right:2.4rem" onkeydown="if(event.key==='Enter')handleSignup()"/>
        <button class="auth-eye" onclick="toggleAuthPass('suConf',this)">👁</button>
      </div>
      <span class="field-error" id="suConfErr"></span>
    </div>

    <button class="btn-auth" onclick="handleSignup()">Create Account →</button>

    <div class="auth-divider">or</div>
    <button class="btn-guest" onclick="continueAsGuest()">Continue as Guest</button>
  </div>

</div>

<div id="authToast"></div>
<script src="auth.js"></script>
</body>
</html>
